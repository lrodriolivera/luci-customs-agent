# nginx del frontend LUCI: sirve el SPA y proxea /api al backend (con Authorization explícito, ver MEMORY.md).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25M;   # subida de documentos aduaneros

    location /api/ {
        proxy_pass http://luci-backend:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;   # imprescindible (fix MEMORY.md 2/Mar)
        proxy_read_timeout 300s;   # llamadas a Bedrock/AEAT pueden tardar
    }

    location / {
        # style-src lleva 'unsafe-inline' porque MUI/emotion, recharts y react-hot-toast inyectan estilos inline.
        # Si se activa Sentry (VITE_SENTRY_DSN), añadir su dominio de ingest a connect-src.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
