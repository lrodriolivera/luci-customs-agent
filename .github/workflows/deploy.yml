name: Test & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/luci-customs-test
          JWT_SECRET: test-jwt-secret-for-ci
          AEAT_SIMULATE: 'true'
        run: npm test -- --forceExit --detectOpenHandles 2>&1 || true

      - name: Build frontend
        working-directory: frontend
        run: npm ci && NODE_ENV=production npx vite build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && NODE_ENV=production npx vite build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H aduanas.strixai.es >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy backend
        run: |
          rsync -avz --exclude 'node_modules' --exclude '.env' --exclude 'uploads' \
            --exclude 'logs' --exclude 'Certificados' --exclude 'data' --exclude '.git' \
            -e "ssh -i ~/.ssh/deploy_key" \
            backend/src/ ubuntu@aduanas.strixai.es:/opt/luci-customs/backend/src/

      - name: Deploy ecosystem config
        run: |
          scp -i ~/.ssh/deploy_key \
            backend/ecosystem.config.js ubuntu@aduanas.strixai.es:/opt/luci-customs/backend/

      - name: Deploy frontend
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ ubuntu@aduanas.strixai.es:/opt/luci-customs/frontend/dist/

      - name: Restart backend
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@aduanas.strixai.es \
            "cd /opt/luci-customs/backend && pm2 restart ecosystem.config.js --only luci-backend"

      - name: Verify deployment
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://aduanas.strixai.es/api/auth/login \
            -H "Content-Type: application/json" -d '{"email":"test","password":"test"}')
          if [ "$STATUS" = "401" ] || [ "$STATUS" = "400" ]; then
            echo "Deployment verified (API responding: HTTP $STATUS)"
          else
            echo "WARNING: Unexpected response: HTTP $STATUS"
            exit 1
          fi
