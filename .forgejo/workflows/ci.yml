name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # El runner corre en el Mac Studio (ARM64) desde el 25-sep-2026, y MongoDB no
  # publica binarios de Debian 12 para ARM64: mongodb-memory-server pedia
  # mongodb-linux-aarch64-debian12-*.tgz, recibia 403 y los tests se quedaban
  # esperando el mongod sin fin. El binario de Ubuntu 22.04 funciona en la
  # imagen node:20-bookworm del runner (comprobado con mongod 8.2.6).
  # El timeout evita que un cuelgue asi vuelva a bloquear el unico runner.
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MONGOMS_DISTRO: ubuntu-22.04
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - uses: https://code.forgejo.org/actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm test

  # Los tests van ANTES del build y en el mismo job: `npm run build` solo empaqueta
  # lo alcanzable desde App.jsx, asi que no detecta roturas en ficheros que ninguna
  # ruta importa todavia. Asi se colo `lucide-react` sin declarar en package.json:
  # el build pasaba y la suite de Portal caia a 0 tests en cualquier checkout limpio.
  frontend-tests-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - uses: https://code.forgejo.org/actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://aduanas.strixai.ai
          VITE_APP_NAME: LUCI Customs Agent
          VITE_COGNITO_USER_POOL_ID: eu-west-1_nPgP4hCF3
          VITE_COGNITO_CLIENT_ID: 3sjai6tmg2onposaaiul0trau2
